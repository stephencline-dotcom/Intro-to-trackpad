<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Intro to Trackpad</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <link
    rel="stylesheet"
    href="lesson-shell.css"
  />
</head>

<body class="student-home-page">

  <main class="student-home-shell">

    <section class="student-home-card">

      <div class="student-home-icon">
        ☝️
      </div>

      <h1>
        Intro to Trackpad
      </h1>

      <p id="studentHomeMessage">
        Ready to practice your trackpad skills?
      </p>

      <a
        id="studentHomeStart"
        class="student-home-start"
        href="lesson.html?view=student"
      >
        Start Lesson
      </a>

    </section>

  </main>

  <script>
    const studentHomeStart =
      document.getElementById(
        'studentHomeStart'
      );

    const studentHomeMessage =
      document.getElementById(
        'studentHomeMessage'
      );

    async function updateStudentHome() {
      try {
        const response =
          await fetch(
            '/api/lesson-state',
            {
              cache: 'no-store',
            }
          );

        if (!response.ok) {
          return;
        }

        const state =
          await response.json();

        if (
          state &&
          state.syncEnabled === true
        ) {
          studentHomeStart.textContent =
            'Return to Class';

          studentHomeMessage.textContent =
            'Your class lesson is in progress.';

          const activeLesson =
            Number.isInteger(
              Number.parseInt(
                state.lesson,
                10
              )
            )
              ? Number.parseInt(
                  state.lesson,
                  10
                )
              : 1;

          studentHomeStart.href =
            `lesson.html?lesson=${activeLesson}&view=student`;

          return;
        }
      } catch {
        // Keep normal Start Lesson behavior.
      }

      studentHomeStart.textContent =
        'Start Lesson';

      studentHomeMessage.textContent =
        'Ready to practice your trackpad skills?';

      studentHomeStart.href =
        'lesson.html?view=student';
    }

    /*
     * Prepare lesson audio during the
     * student's existing Start Lesson click.
     * This allows movement-only activities
     * to play sounds without another prompt.
     */
    const studentLessonSoundPrimer =
      new Audio(
        'sounds/sparkle.mp3'
      );

    studentLessonSoundPrimer.preload =
      'auto';

    studentLessonSoundPrimer.volume =
      0.18;

    studentHomeStart.addEventListener(
      'click',
      async (event) => {
        event.preventDefault();

        const destination =
          studentHomeStart.href;

        try {
          studentLessonSoundPrimer.currentTime =
            0;

          await studentLessonSoundPrimer.play();

          /*
           * Give the browser a moment to
           * register audio playback before
           * opening the lesson page.
           */
          window.setTimeout(
            () => {
              window.location.href =
                destination;
            },
            140
          );
        } catch {
          /*
           * Never prevent a student from
           * entering the lesson if audio
           * happens to be unavailable.
           */
          window.location.href =
            destination;
        }
      }
    );

    updateStudentHome();
  </script>

</body>
</html>
